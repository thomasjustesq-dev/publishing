# Decap CMS — The Adversarial System essays
# Local: npm run cms + npm run dev:tas → http://localhost:4322/admin/
# Production: shared OAuth host is JAQ (one GitHub OAuth App callback URL).
# Both CMS UIs auth through https://www.just-asking-questions.com/api/*

local_backend: true

backend:
  name: github
  repo: thomasjustesq-dev/publishing
  branch: main
  base_url: https://www.just-asking-questions.com
  auth_endpoint: api/auth

media_folder: sites/adversarial-system/public/essays/_uploads
public_folder: /essays/_uploads

collections:
  - name: essays
    label: Filings
    label_singular: Filing
    folder: sites/adversarial-system/src/content/essays
    create: true
    slug: "{{slug}}"
    extension: md
    format: frontmatter
    fields:
      - { label: Title, name: title, widget: string }
      - { label: Description, name: description, widget: text }
      - { label: Date, name: date, widget: datetime, date_format: YYYY-MM-DD, time_format: false }
      - { label: Draft, name: draft, widget: boolean, default: true }
      - label: Format
        name: format
        widget: select
        options: [essay, podcast, video, teaser]
        default: essay
      - { label: Paywalled, name: paywalled, widget: boolean, default: false }
      - { label: Hero path, name: hero, widget: string, required: false }
      - { label: Hero alt, name: heroAlt, widget: string, required: false }
      - { label: Substack URL, name: substackUrl, widget: string, required: false }
      - { label: Tags, name: tags, widget: list, default: [] }
      - { label: Related slugs, name: related, widget: list, default: [] }
      - { label: Body, name: body, widget: markdown }
