# Decap CMS — Just Asking Questions essays
# Local: npm run cms  (decap-server proxy on :8081) + npm run dev:jaq
# Production GitHub OAuth: set REPO secrets and deploy oauth proxy (see docs/CMS.md)

local_backend: true

backend:
  name: github
  repo: thomasjustesq-dev/publishing
  branch: main
  base_url: https://api.netlify.com
  auth_endpoint: auth

media_folder: sites/just-asking-questions/public/essays/_uploads
public_folder: /essays/_uploads

collections:
  - name: essays
    label: Essays
    label_singular: Essay
    folder: sites/just-asking-questions/src/content/essays
    create: true
    slug: "{{slug}}"
    extension: md
    format: frontmatter
    fields:
      - { label: Title, name: title, widget: string }
      - { label: Description, name: description, widget: text }
      - { label: Date, name: date, widget: datetime, date_format: YYYY-MM-DD, time_format: false }
      - { label: Draft, name: draft, widget: boolean, default: true }
      - label: Format
        name: format
        widget: select
        options: [essay, podcast, video, teaser]
        default: essay
      - { label: Paywalled, name: paywalled, widget: boolean, default: false }
      - { label: Hero path, name: hero, widget: string, required: false, hint: "/essays/slug/cover.webp" }
      - { label: Hero alt, name: heroAlt, widget: string, required: false }
      - { label: Substack URL, name: substackUrl, widget: string, required: false }
      - { label: Video URL, name: videoUrl, widget: string, required: false }
      - { label: Audio URL, name: audioUrl, widget: string, required: false }
      - { label: Tags, name: tags, widget: list, default: [] }
      - { label: Related slugs, name: related, widget: list, default: [] }
      - { label: Body, name: body, widget: markdown }
