name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [22, 24]
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install workspace dependencies
        run: npm ci

      - name: Check content, images, and unit tests
        run: npm run check

      - name: Build sites
        run: npm run build

      - name: Verify Vercel configs stay in sync with site-kit
        shell: bash
        run: |
          set -euo pipefail
          node scripts/sync-vercel-config.mjs
          git diff --exit-code -- sites/*/vercel.json

      - name: Hero image budget (fail if any hero exceeds hard max)
        run: node scripts/check-images.mjs
